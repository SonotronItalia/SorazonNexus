# Solo sviluppo (make db, make dev, make seed): espone il database sul Mac per il backend locale.
# Non usarlo con lo stack: da Docker 28 una porta pubblicata è raggiungibile anche dalle altre
# reti Docker, quindi il frontend arriverebbe al database (anche con 127.0.0.1).
services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  # Casella finta per le email di sviluppo: nessuna email parte davvero.
  # Le vedi su http://localhost:8025 (il backend locale invia su 127.0.0.1:1025).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
