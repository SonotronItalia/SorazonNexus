# Versioni minime per vulnerabilità note (pnpm audit): sharp arriva anche da next con una
# versione fissata, dompurify dal pannello di Payload. Toglierle quando i pacchetti le includono.
overrides:
  sharp: '>=0.35.5'
  dompurify: '>=3.4.17'
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - '@payloadcms/admin-bar@3.91.0'
  - '@payloadcms/db-postgres@3.91.0'
  - '@payloadcms/drizzle@3.91.0'
  - '@payloadcms/graphql@3.91.0'
  - '@payloadcms/live-preview-react@3.91.0'
  - '@payloadcms/live-preview@3.91.0'
  - '@payloadcms/next@3.91.0'
  - '@payloadcms/plugin-form-builder@3.91.0'
  - '@payloadcms/plugin-nested-docs@3.91.0'
  - '@payloadcms/plugin-redirects@3.91.0'
  - '@payloadcms/plugin-search@3.91.0'
  - '@payloadcms/plugin-seo@3.91.0'
  - '@payloadcms/richtext-lexical@3.91.0'
  - '@payloadcms/translations@3.91.0'
  - '@payloadcms/ui@3.91.0'
  - payload@3.91.0
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
