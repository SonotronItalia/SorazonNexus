# Proxy temporaneo usato solo da `make tunnel` (scripts/tunnel.sh), tra Cloudflare e lo stack.
# Aggiunge "no-transform" al Cache-Control: senza, Cloudflare riscrive gli indirizzi email
# nell'HTML (Email Obfuscation) e React, trovando una pagina diversa, lascia lo schermo bianco.
map $upstream_http_cache_control $cache_control {
    ""      "no-transform";
    default "$upstream_http_cache_control, no-transform";
}

server {
    listen 3080;
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $cache_control always;
    }
}

server {
    listen 3081;
    client_max_body_size 50m;
    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $http_host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $cache_control always;
    }
}
