name: sorazon

x-restart: &restart
  restart: unless-stopped

# Backend e frontend (Node, utente non root): nessun privilegio Linux e nessun modo di ottenerne
x-limitato: &limitato
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

networks:
  net_data:   # db <-> backend. Il frontend NON è qui: non può raggiungere il database
  net_app:    # frontend <-> backend (e proxy)

volumes:
  pgdata:
  media:
  certbot_conf:   # certificati HTTPS (Let's Encrypt o provvisori)
  certbot_www:    # file della verifica di Let's Encrypt

services:
  # ---------- 1. DATABASE ----------
  db:
    <<: *restart
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Nessuna porta pubblicata: renderebbe il database raggiungibile dal frontend.
    # In sviluppo la apre docker-compose.dev.yml (make db).
    networks: [net_data]

  # ---------- Job una tantum: migrazioni (non è un container permanente) ----------
  migrate:
    build:
      context: ./backend
      target: build
    command: ["pnpm", "payload", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [net_data]

  # ---------- Contenuti di partenza nello stack (make seed con lo stack acceso) ----------
  # Gira nell'immagine di build (sorgenti + dati del seed) e scrive i media nello STESSO volume
  # del backend: così le immagini caricate dal seed si vedono nel sito servito da Docker.
  seed:
    build:
      context: ./backend
      target: build
    profiles: ["strumenti"]
    command: ["pnpm", "payload", "run", "src/seed/index.ts"]
    # Solo per l'admin di sviluppo (SEED_ADMIN_*): sul server il file non c'è e il seed lo salta
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      MEDIA_DIR: /data/media
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [net_data, net_app]

  # ---------- 2. BACKEND (solo Payload) ----------
  backend:
    <<: [*restart, *limitato]
    build:
      context: ./backend
      target: run
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-it@sonotronitalia.com}
      EMAIL_INFO: ${EMAIL_INFO:-info@sonotronitalia.com}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/users/me || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:3001:3000"
    networks: [net_data, net_app]

  # ---------- 3. FRONTEND (solo Next.js) ----------
  frontend:
    <<: [*restart, *limitato]
    build:
      context: ./frontend
      args:
        PAYLOAD_INTERNAL_URL: http://backend:3000
    environment:
      PAYLOAD_INTERNAL_URL: http://backend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      SITE_URL: ${FRONTEND_PUBLIC_URL}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-}
      GOOGLE_ADS_ID: ${GOOGLE_ADS_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [net_app]

  # ---------- Proxy (solo con --profile proxy) ----------
  nginx:
    <<: *restart
    image: nginx:1.28-alpine
    profiles: ["proxy"]
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST}
      BACKEND_HOST: ${BACKEND_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/attendi-certificati.sh:/docker-entrypoint.d/40-attendi-certificati.sh:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on: [frontend, backend, certbot]
    networks: [net_app]

  # Certificati HTTPS: provvisori all'avvio, poi Let's Encrypt e rinnovo (vedi nginx/certbot.sh)
  certbot:
    <<: *restart
    image: certbot/certbot:v5.1.0
    profiles: ["proxy"]
    entrypoint: ["/bin/sh", "/certbot.sh"]
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST}
      BACKEND_HOST: ${BACKEND_HOST}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - ./nginx/certbot.sh:/certbot.sh:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [net_app]
