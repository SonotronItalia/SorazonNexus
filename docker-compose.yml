name: sorazon

x-restart: &restart
  restart: unless-stopped

networks:
  net_data:   # db <-> backend. Il frontend NON è qui: non può raggiungere il database
  net_app:    # frontend <-> backend (e proxy)

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:

services:
  # ---------- 1. DATABASE ----------
  db:
    <<: *restart
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Nessuna porta pubblicata: renderebbe il database raggiungibile dal frontend.
    # In sviluppo la apre docker-compose.dev.yml (make db).
    networks: [net_data]

  # ---------- Job una tantum: migrazioni (non è un container permanente) ----------
  migrate:
    build:
      context: ./backend
      target: build
    command: ["pnpm", "payload", "migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [net_data]

  # ---------- 2. BACKEND (solo Payload) ----------
  backend:
    <<: *restart
    build:
      context: ./backend
      target: run
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL}
      FRONTEND_INTERNAL_URL: http://frontend:3000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/users/me || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:3001:3000"
    networks: [net_data, net_app]

  # ---------- 3. FRONTEND (solo Next.js) ----------
  frontend:
    <<: *restart
    build:
      context: ./frontend
      args:
        PAYLOAD_INTERNAL_URL: http://backend:3000
    environment:
      PAYLOAD_INTERNAL_URL: http://backend:3000
      PAYLOAD_API_KEY: ${PAYLOAD_API_KEY:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      SITE_URL: ${FRONTEND_PUBLIC_URL}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks: [net_app]

  # ---------- Proxy (solo con --profile proxy) ----------
  caddy:
    <<: *restart
    image: caddy:2
    profiles: ["proxy"]
    environment:
      FRONTEND_HOST: ${FRONTEND_HOST}
      BACKEND_HOST: ${BACKEND_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    networks: [net_app]
